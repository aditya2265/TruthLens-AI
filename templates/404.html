{% extends "base.html" %}

{% block title %}404 Page Not Found — TruthLens AI{% endblock %}

{% block content %}
<section class="dashboard-card" style="text-align: center; padding: 4rem 2rem;">
  <div style="font-size: 3.5rem; font-weight: 800; color: var(--cyan-primary); font-family: var(--font-mono); margin-bottom: 0.5rem;">
    404
  </div>
  <h1 style="font-size: 1.5rem; margin-bottom: 1rem; color: #ffffff;">Page Not Found</h1>
  <p style="color: var(--text-secondary); max-width: 500px; margin: 0 auto 1.5rem;">
    The requested resource does not exist on this server.
  </p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Dashboard</a>
</section>
{% endblock %}
