{% extends "base.html" %}

{% block title %}400 Bad Request — TruthLens AI{% endblock %}

{% block content %}
<section class="dashboard-card" style="text-align: center; padding: 4rem 2rem;">
  <div style="font-size: 3.5rem; font-weight: 800; color: #f59e0b; font-family: var(--font-mono); margin-bottom: 0.5rem;">
    400
  </div>
  <h1 style="font-size: 1.5rem; margin-bottom: 1rem; color: #ffffff;">Bad Request</h1>
  <p style="color: var(--text-secondary); max-width: 500px; margin: 0 auto 1.5rem;">
    {{ message or "The submitted request could not be authenticated or was malformed." }}
  </p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Dashboard</a>
</section>
{% endblock %}
